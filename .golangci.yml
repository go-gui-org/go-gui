version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gocyclo
    - modernize
    - unused
    - revive
    - gocritic
    - cyclop
    - perfsprint
    - gosmopolitan
  settings:
    gocyclo:
      min-complexity: 30
    cyclop:
      max-complexity: 50
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - name: exported
        - name: if-return
        - name: error-strings
        - name: unexported-return
  exclusions:
    generated: lax
    rules:
      # glbind mirrors the C OpenGL API 1:1 so that call sites need no
      # changes: SCREAMING_SNAKE enum names and one thin wrapper per entry
      # point. Idiomatic Go naming and 100 per-symbol doc comments restating
      # the GL reference pages would defeat that and hide the real content.
      - path: gui/backend/internal/glbind/
        text: "should have comment or be unexported"
      - path: gui/backend/internal/glbind/
        text: "ALL_CAPS|underscore"
      - path: _test\.go
        linters:
          - errcheck
          - gocyclo
          - cyclop
      - path: _test\.go
        text: SA5011
      - path: _test\.go
        linters:
          - gosmopolitan
      - path: examples/
        linters:
          - gosmopolitan
      - path: native_platform_noop\.go
        linters:
          - revive
      - path: gui/backend/(gl|metal|ios|android)/
        text: "unkeyed fields"
