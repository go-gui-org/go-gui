name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-gui

      - uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-glyph
          path: go-glyph

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # No system packages. `make build-linux` is CGO_ENABLED=0, so the
      # showcase links no C at all: X11 is jezek/xgb over a socket, GL is
      # dlopened through purego, and audio defaults to the pure-Go
      # PulseAudio sink. None of the headers installed here had a caller.
      - name: Add go-glyph replace
        working-directory: go-gui
        run: go mod edit -replace=github.com/go-gui-org/go-glyph=../go-glyph

      # Same target a developer runs locally, so a release can be
      # rehearsed with `make release` before the tag is pushed.
      - name: Package amd64 and arm64
        working-directory: go-gui
        run: make package-linux

      - uses: actions/upload-artifact@v7
        with:
          name: linux-asset
          path: go-gui/dist/go-gui-showcase-*.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-gui

      - uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-glyph
          path: go-glyph

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Add go-glyph replace
        working-directory: go-gui
        run: go mod edit -replace=github.com/go-gui-org/go-glyph=../go-glyph

      # Builds arm64 and amd64, fuses them with lipo, bundles the result
      # as Go-Gui Showcase.app and writes an ad-hoc signed .dmg.  One
      # download serves Apple silicon and Intel.
      - name: Package universal .dmg
        working-directory: go-gui
        run: make package-macos

      - uses: actions/upload-artifact@v7
        with:
          name: macos-asset
          path: go-gui/dist/Go-Gui-Showcase-*.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-gui

      - uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-glyph
          path: go-glyph

      # msys2 gives the job a POSIX shell and `make`, so the Build step
      # runs the same build-windows target a developer runs locally.
      # The `zip` tool is no longer needed: buildapp writes the archive
      # itself.  The showcase builds cgo-free (purego GL bindings, #155).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          release: false
          path-type: inherit
          install: >-
            make

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Add go-glyph replace
        working-directory: go-gui
        run: go mod edit -replace=github.com/go-gui-org/go-glyph=../go-glyph

      # Each .exe is linked -H windowsgui, so no console window opens
      # behind the showcase.
      - name: Package amd64 and arm64
        working-directory: go-gui
        run: make package-windows

      - uses: actions/upload-artifact@v7
        with:
          name: windows-asset
          path: go-gui/dist/go-gui-showcase-*.zip

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-gui

      - uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-glyph
          path: go-glyph

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Add go-glyph replace
        working-directory: go-gui
        run: go mod edit -replace=github.com/go-gui-org/go-glyph=../go-glyph

      - name: Build c-archive (device)
        working-directory: go-gui/examples/ios_demo
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$CC" \
            CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
            CGO_LDFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
            go build -buildmode=c-archive -tags ios -o libgoguiapp-device.a .

      - name: Build c-archive (simulator)
        working-directory: go-gui/examples/ios_demo
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          CC=$(xcrun --sdk iphonesimulator --find clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$CC" \
            CGO_CFLAGS="-isysroot $SDK -arch arm64 -mios-simulator-version-min=17.0" \
            CGO_LDFLAGS="-isysroot $SDK -arch arm64 -mios-simulator-version-min=17.0" \
            go build -buildmode=c-archive -tags ios -o ios/libgoguiapp.a .

      - name: Build simulator .app
        working-directory: go-gui/examples/ios_demo
        run: |
          xcodebuild -project ios/IOSDemo.xcodeproj \
            -scheme IOSDemo \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build/xcode \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package
        working-directory: go-gui
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          mkdir -p build/ios-device build/ios-simulator
          # Device: static library for app developers
          cp examples/ios_demo/libgoguiapp-device.a build/ios-device/libgoguiapp.a
          cp gui/backend/ios/ios_app.h build/ios-device/
          # Simulator: runnable .app (no Developer account needed)
          cp -a examples/ios_demo/build/xcode/Build/Products/Debug-iphonesimulator/IOSDemo.app \
            build/ios-simulator/
          cp examples/ios_demo/ios/IOSDemo/README.md build/ios-simulator/
          cd build && zip "../go-gui-ios-${VERSION}.zip" \
            ios-device/libgoguiapp.a ios-device/ios_app.h \
            -r ios-simulator/IOSDemo.app ios-simulator/README.md

      - uses: actions/upload-artifact@v7
        with:
          name: ios-asset
          path: go-gui/go-gui-ios-*.zip

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-gui

      - uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-glyph
          path: go-glyph

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Add go-glyph replace
        working-directory: go-gui
        run: go mod edit -replace=github.com/go-gui-org/go-glyph=../go-glyph

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          gomobile init

      - name: Build AAR
        working-directory: go-gui/examples/android_demo
        run: |
          gomobile bind -target=android/arm64 -androidapi 24 \
            -o gogui.aar .

      - name: Package
        working-directory: go-gui
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          mkdir -p build/android
          cp examples/android_demo/gogui.aar build/android/
          cp examples/android_demo/gogui-sources.jar build/android/ 2>/dev/null || true
          cd build && zip "../go-gui-android-${VERSION}.zip" \
            android/gogui.aar android/gogui-sources.jar

      - uses: actions/upload-artifact@v7
        with:
          name: android-asset
          path: go-gui/go-gui-android-*.zip

  publish:
    name: Publish Release
    needs: [linux, macos, windows, ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-asset'
          merge-multiple: true
          path: assets

      # Pinned to a commit rather than the v3 tag: a tag can be moved to
      # point at different code, a commit cannot.  This commit is release
      # 3.0.3, which is what refs/tags/v3 dereferenced to when it was
      # written.  Bump it deliberately, after reading the diff.
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: assets/*
