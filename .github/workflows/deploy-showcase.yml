name: Deploy Showcase
on:
  push:
    branches: [main]
    paths:
      - 'examples/showcase/**'
      - 'gui/**'
      - '.github/workflows/deploy-showcase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build WASM
        run: |
          cd examples/showcase
          GOOS=js GOARCH=wasm go build \
            -ldflags "-X github.com/go-gui-org/go-gui/gui.Version=$(git describe --tags --always)" \
            -o main.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" .
          cp ../../gui/backend/web/gogui.js .

      - name: Prepare deploy directory
        run: |
          # Clone the website repo so its files carry over into the deploy.
          git clone --depth 1 \
            https://x-access-token:${{ secrets.WEBSITE_DEPLOY_TOKEN }}@github.com/go-gui-org/go-gui-org.github.io.git \
            /tmp/website
          # force_orphan below replaces the whole site. Copy the whole website tree
          # (all files, not a list) so nothing added to the site is lost. A fixed list
          # deleted every file not on it (robots.txt, sitemap.xml, then images).
          # The old showcase/ is skipped because the new build replaces it.
          mkdir -p deploy
          rsync -a --exclude .git --exclude showcase /tmp/website/ deploy/
          mkdir -p deploy/showcase
          cp -a examples/showcase/*.js examples/showcase/*.wasm examples/showcase/*.html deploy/showcase/ 2>/dev/null || true
          ls -la deploy/ deploy/showcase/

      - name: Deploy to org website
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: go-gui-org/go-gui-org.github.io
          publish_branch: main
          publish_dir: ./deploy
          force_orphan: true
          # Do not exclude directory names such as docs/ or assets/ here. The deploy
          # now holds the whole website tree, so those patterns would delete site
          # directories that use the same names.
          exclude_assets: '.github,.gitignore,Makefile,*.go'
