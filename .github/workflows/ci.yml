name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph
        with:
          # No Linux system deps needed: the module has no cgo files on
          # Linux (go-glyph's shaping is pure-Go; gl is purego; oto only
          # compiles under -tags otoaudio), and -race needs only the gcc
          # that ships on the runner.
          install-linux-deps: 'false'

      - name: Test
        # -race needs cgo, and mingw is not on PATH on Windows runners.
        # Windows runs the suite un-raced (the suite only reached Windows
        # CI with #235); race coverage stays on Linux/macOS.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test -count=2 -timeout=10m ./gui/...
          else
            CGO_LDFLAGS="$(go env CGO_LDFLAGS)" \
              go test -count=2 -race -timeout=10m ./gui/...
          fi

      # A failing pixel golden is undebuggable from a log: the actual,
      # expected and diff PNGs are what tell whether the renderer
      # moved or the tolerance needs widening. TestPixelGolden writes
      # them under gui/backend/soft/testdata/failures/ (gitignored).
      - name: Upload pixel-golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixel-golden-failures-${{ matrix.os }}
          path: gui/backend/soft/testdata/failures
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph
        with:
          # No Linux system deps needed: plain `go test` builds the
          # cgo-free module without any X11/harfbuzz headers.
          install-linux-deps: 'false'

      - name: Test with coverage
        run: go test -count=1 -coverprofile=coverage.out ./gui/...

      # Thresholds and floors live in scripts/coverage-gate.sh, shared
      # with `make coverage-gate` (issue #292).
      - name: Check coverage gates
        run: scripts/coverage-gate.sh coverage.out

      - name: Save baseline coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: coverage.out
          key: coverage-baseline-${{ github.sha }}

      - name: Restore baseline coverage for diff
        if: github.event_name == 'pull_request'
        id: cov-baseline
        uses: actions/cache/restore@v5
        with:
          path: coverage-baseline.out
          key: coverage-baseline-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            coverage-baseline-

      - name: Coverage diff on PR
        if: github.event_name == 'pull_request'
        run: scripts/cov-diff.sh --github-summary coverage-baseline.out coverage.out

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 30

  # The old single Vet job ran vet, four cross-compiles and four lint
  # passes one after another: ~9.5 minutes, the longest job in the run.
  # Each part is now its own job, so they run at the same time on
  # separate runners. Separate runners, not background processes in one
  # job: a hosted runner has 4 vCPUs, and both builds and lint use all
  # of them. The `vet` job at the end keeps the name "Vet", which is a
  # required status check on main.
  vet-core:
    name: Vet (go vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # Only job that needs the deps: the -tags otoaudio ALSA sink
      # compiles oto v3, whose Linux driver binds ALSA via cgo
      # (#cgo pkg-config: alsa) — libasound2-dev must be present.
      - name: Install system dependencies
        run: ./scripts/install-ubuntu-deps.sh

      - name: Vet
        run: go vet ./...

      # The opt-in oto/ALSA sink is excluded from the cgo-free
      # cross-compile builds, so compile it explicitly or it bit-rots
      # unnoticed.
      - name: Build oto/ALSA audio sink (-tags otoaudio)
        run: go build -tags otoaudio ./gui/audio/...

      - name: Required-ID check
        run: go run ./tools/requiredid/cmd/requiredid ./...

      # Gates on hand-rolled `:` composition of widget IDs, which is how
      # scoping drifts between a producer and its lookup site. Only mode
      # ids is pass/fail (focus/callbacks are advisory inventories), so
      # unlike `make ergonomics-audit` the step runs ids alone.
      - name: Ergo-audit IDs
        run: go run ./tools/ergonomics-audit/ -mode ids .

  # Guards the CGo-free desktop build. The whole module must keep
  # cross-compiling with no C toolchain on the host; a new cgo import
  # anywhere reds this job. gui/audio's default Linux output is the
  # pure-Go PulseAudio sink; oto (ALSA) is opt-in via -tags otoaudio,
  # so ./... stays cgo-free here. One job per target: each build uses
  # every core of the runner, so they gain nothing from sharing one.
  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: CGo-free build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          CGO_ENABLED=0 GOOS=${TARGET%/*} GOARCH=${TARGET#*/} \
            go build ./...

  # Linting is a type-check, not an execution, so every GOOS analyses
  # fine from a Linux runner. One job per GOOS:
  #   - linux: the runner's own build.
  #   - windows: every //go:build windows file (27 of them: gl/, sni/,
  #     filedialog/, hicon/) was never linted by CI and had accumulated
  #     a baseline nothing would flag.
  #   - js: same blind spot, for the browser build (gui/backend/web),
  #     which had a two-issue baseline. GOARCH must be wasm — js/amd64
  #     is not a valid target pair.
  #   - darwin: analyses with cgo disabled (automatic for
  #     cross-compilation), which covers the cgo-free darwin files. The
  #     cgo core of the metal backend still needs a macOS runner;
  #     tracked separately.
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: js
            goarch: wasm
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # The Makefile clears GOOS/GOARCH while it builds the linter
      # itself, so these pick only the build being analysed.
      - name: Lint
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make lint

  # Aggregate result under the old job name. "Vet" is a required status
  # check on main; without this job, a lint or cross-compile failure in
  # the split jobs above would not block a merge. `if: always()` makes it
  # run, and fail, when a job it needs fails. A skipped job does not
  # report as a passed required check.
  vet:
    name: Vet
    needs: [vet-core, cross-compile, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every vet, cross-compile and lint job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a Vet job did not succeed ($r)"; exit 1; }
          done

  # No `needs:`. Check is a fast gate (~90s), so it starts with every
  # other job and fails first, instead of waiting ~9 minutes for Test
  # and Vet. The cost: it also runs when those jobs fail.
  check:
    name: Check (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph
        with:
          # No Linux system deps needed: vet/tidy/gates build the
          # cgo-free module without any X11/harfbuzz headers.
          install-linux-deps: 'false'
          add-replace: 'false'

      # tidy-check must run BEFORE the go-glyph replace directive is
      # added, otherwise go mod tidy persists the replace into go.mod
      # and prunes go-glyph from go.sum, triggering a spurious diff.
      - name: Run tidy-check (before replace)
        run: make tidy-check

      - name: Add go-glyph replace
        run: go mod edit -replace=github.com/go-gui-org/go-glyph=./go-glyph

      - name: Run gate checks
        run: make vet deps-doc-check large-files generate-check changelog-check

      # Markdown formatting is a repo convention with no compiler behind
      # it, so it drifts silently -- CHANGELOG.md accumulated hand-wrapping
      # that no gate ever saw. Prettier reads .prettierrc for the wrap
      # width, so the flags are not restated here.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check Markdown formatting
        run: make fmt-md-check

      # The export-audit gate needs the sibling consumer repos present to
      # be authoritative (an export used only there would misclassify as
      # internal-only). Shallow-clone them beside the checkout and run the
      # consumer scan; the in-repo run alone cannot fail anything.
      - name: Run export-audit (authoritative)
        run: |
          for repo in go-charts go-edit go-kite go-term go-map; do
            git clone --quiet --depth 1 https://github.com/go-gui-org/$repo.git ../$repo
          done
          go run ./tools/exportaudit/ -mode gate -gui . \
            ../go-charts ../go-edit ../go-kite ../go-term ../go-map

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph
        with:
          # No Linux system deps needed: examples build the cgo-free
          # module (no X11/harfbuzz headers required).
          install-linux-deps: 'false'

      - name: Build examples
        run: make build-examples

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph

      - name: Build c-archive
        working-directory: examples/ios_demo
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$CC" \
            CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
            CGO_LDFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
            go build -buildmode=c-archive -tags ios -o /dev/null .

      - name: Build c-archive (simulator)
        working-directory: examples/ios_demo
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          CC=$(xcrun --sdk iphonesimulator --find clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$CC" \
            CGO_CFLAGS="-isysroot $SDK -arch arm64 -mios-simulator-version-min=17.0" \
            CGO_LDFLAGS="-isysroot $SDK -arch arm64 -mios-simulator-version-min=17.0" \
            go build -buildmode=c-archive -tags ios -o ios/libgoguiapp.a .

      - name: Build simulator .app (link check)
        working-directory: examples/ios_demo
        run: |
          xcodebuild -project ios/IOSDemo.xcodeproj \
            -scheme IOSDemo \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath /tmp/ios-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Vet backend
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CGO_ENABLED=1 \
          GOOS=darwin \
          GOARCH=arm64 \
          CC="clang -isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
          go vet -tags ios ./gui/backend/ios/...

      # Full-module lint for the ios build, using the same trick as the
      # vet step above: GOOS=darwin with the -tags ios flag satisfies
      # //go:build ios while the iphoneos sysroot gives the cgo .m files
      # a toolchain, and !ios-tagged darwin files (metal, sysbeep) drop
      # out. The sysbeep test's `&& !ios` tag keeps it from referencing
      # symbols that only the darwin cgo implementation provides.
      - name: Locate iOS SDK
        run: echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Lint (GOOS=ios)
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
          CC: clang
          CGO_CFLAGS: -isysroot ${{ env.IOS_SDK }} -arch arm64 -miphoneos-version-min=15.0
          CGO_LDFLAGS: -isysroot ${{ env.IOS_SDK }} -arch arm64 -miphoneos-version-min=15.0
        run: make lint LINT_ARGS=--build-tags=ios

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph

      - name: Build
        run: GOOS=js GOARCH=wasm go build ./...

      - name: Vet
        run: GOOS=js GOARCH=wasm go vet ./...

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test
        run: |
          NODE_JS="$(find "$(go env GOROOT)" -name wasm_exec_node.js -print -quit)"
          printf '#!/bin/bash\nexec node "%s" "$@"\n' "$NODE_JS" > /tmp/go_js_wasm_exec
          chmod +x /tmp/go_js_wasm_exec
          GOOS=js GOARCH=wasm go test -exec=/tmp/go_js_wasm_exec ./gui/...

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # No C toolchain: the Windows build is CGO_ENABLED=0 end to end.
      # msys2 remains only for (a) Mesa's software opengl32.dll, which the
      # GPU-less runner needs at *runtime* for the smoke test, and (b) the
      # bash shell those steps are written in.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          release: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-mesa

      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Test (headless)
        run: CGO_ENABLED=0 go test ./gui/...

      - name: Build showcase
        run: |
          CGO_ENABLED=0 go build \
            -o build/showcase-windows.exe ./examples/showcase/

      - name: Smoke test showcase
        run: |
          # The runner has no GPU: system opengl32.dll is GDI-generic
          # OpenGL 1.1, but the native backend needs 3.3. Drop Mesa's
          # software opengl32.dll (llvmpipe) next to the exe so the
          # app-dir DLL search resolves it first.
          cp /mingw64/bin/opengl32.dll build/
          export GALLIUM_DRIVER=llvmpipe
          echo "Launching showcase (10s timeout to catch DLL load failures)..."
          ./build/showcase-windows.exe &
          PID=$!
          sleep 10
          if ! kill $PID 2>/dev/null; then
            echo "Process exited before timeout — checking exit code..."
            wait $PID
            echo "Showcase exited with code $? (DLL load failures exit non-zero)"
          else
            echo "Showcase started successfully (no DLL failures)"
          fi

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          gomobile init

      - name: Build AAR
        working-directory: examples/android_demo
        run: |
          gomobile bind -target=android/arm64 -androidapi 24 \
            -o /tmp/gogui.aar .

      - name: Vet backend
        run: |
          NDK_CC=$(find $ANDROID_NDK_ROOT -name "aarch64-linux-android*-clang" \
            | grep -v clang++ | sort | tail -1)
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$NDK_CC \
            go vet ./gui/backend/android/...

      # Full-module lint for the android build. Unlike the desktop
      # targets it cannot run cgo-free: purego's android dlfcn uses
      # cgo.Dlopen, and gui/backend/android itself links a C ES3 driver.
      # Lint type-checks the whole module (test files included), not
      # just the backend package the vet step above covers.
      - name: Locate NDK clang
        run: |
          NDK_CC=$(find $ANDROID_NDK_ROOT -name "aarch64-linux-android*-clang" \
            | grep -v clang++ | sort | tail -1)
          echo "NDK_CC=$NDK_CC" >> "$GITHUB_ENV"

      - name: Lint (GOOS=android)
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.NDK_CC }}
        run: make lint

  # History only: uploads the full benchmark run for each main commit. The PR
  # gate does not read it; it benchmarks the base commit itself (see below).
  benchmark:
    name: Benchmarks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install system dependencies
        run: ./scripts/install-ubuntu-deps.sh

      # pipefail: without it the step takes tee's exit status, so a failed
      # `make bench` went green and uploaded its error text as results.
      - name: Run benchmarks
        run: |
          set -o pipefail
          make bench | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 90

  # Benchmarks the PR base and the PR head in the same job, on the same runner.
  # A baseline cached from main is not used: it can come from a different
  # commit than the PR base (restore-keys picks the newest), it ran on a
  # different machine (timing noise), and it does not exist until main has
  # run once.
  benchmark-gate:
    name: Benchmark regression gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The base goes in a sub-directory. It has its own go.mod, so `./gui/...`
      # in the head checkout does not reach into it.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # No system deps: the gate runs pure-Go layout/render benchmarks
      # with nil injected backends, and the module is cgo-free on Linux
      # (gl backend dlopens libEGL at runtime). The apt step copied from
      # the build jobs only slowed the gate down.
      #
      # The base runs its own bench-gate target, so a PR that edits the
      # benchmark list compares only the names both sides have. A base older
      # than the target cannot be compared; skip it instead of failing.
      - name: Run base benchmarks
        id: base
        run: |
          set -o pipefail
          if make -C base -n bench-gate > /dev/null 2>&1; then
            make -C base bench-gate | tee base-benchmarks.txt
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Base commit has no bench-gate target. Skipping comparison."
          fi

      - name: Run PR benchmarks
        run: |
          set -o pipefail
          make bench-gate | tee pr-benchmarks.txt

      - name: Install benchstat
        if: steps.base.outputs.ok == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare benchmarks
        if: steps.base.outputs.ok == 'true'
        env:
          # Two runs of one commit on one machine still gave significant sec/op
          # deltas up to +4.7% (p=0.008 is the smallest p-value n=5 can give,
          # and ~115 benchmarks are tested). Below this, a timing delta is
          # noise. Allocs and bytes are exact counts, so any increase warns.
          TIME_THRESHOLD_PCT: 10
        run: |
          benchstat -format csv base-benchmarks.txt pr-benchmarks.txt > benchstat.csv
          echo "## Benchmark comparison" >> "$GITHUB_STEP_SUMMARY"
          benchstat base-benchmarks.txt pr-benchmarks.txt >> "$GITHUB_STEP_SUMMARY"

          # benchstat CSV holds one table per unit (sec/op, B/op, allocs/op).
          # Each table starts with a header row `,<unit>,CI,<unit>,CI,vs base,P`;
          # data rows are name, old, old CI, new, new CI, delta, p-value.
          # Delta is `~` when not significant and starts with '+' for a
          # significant regression. Skip geomean rows: they carry a delta
          # (often +0.00%) but no p-value, so they are not a regression.
          #
          # sec/op warns only at TIME_THRESHOLD_PCT or more. The percent is
          # parsed by hand: `+Inf%` (a count that was 0) is not a number to
          # every awk, so it is mapped to a value above any threshold.
          awk -F',' -v limit="$TIME_THRESHOLD_PCT" '
            $1 == "" && $6 == "vs base" { unit = $2; next }
            $1 == "" || $1 == "geomean" { next }
            {
              gsub(/"/, "", $6);
              if ($6 !~ /^\+/) { next }
              pct = ($6 ~ /Inf/) ? 1e9 : substr($6, 2) + 0;
              if (unit == "sec/op" && pct < limit + 0) { next }
              printf "::warning::%s %s regressed %s (%s)\n", $1, unit, $6, $7
            }' benchstat.csv

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install system dependencies
        run: ./scripts/install-ubuntu-deps.sh

      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run security scans
        run: make gosec govulncheck
