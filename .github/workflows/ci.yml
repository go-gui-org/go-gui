name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph
        with:
          install-linux-deps: 'true'

      - name: Test
        # -race needs cgo, and mingw is not on PATH on Windows runners.
        # Windows runs the suite un-raced (the suite only reached Windows
        # CI with #235); race coverage stays on Linux/macOS.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test -count=2 -timeout=10m ./gui/...
          else
            CGO_LDFLAGS="$(go env CGO_LDFLAGS)" \
              go test -count=2 -race -timeout=10m ./gui/...
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph
        with:
          install-linux-deps: 'true'

      - name: Test with coverage
        run: go test -count=1 -coverprofile=coverage.out ./gui/...

      # Thresholds and floors live in scripts/coverage-gate.sh, shared
      # with `make coverage-gate` (issue #292).
      - name: Check coverage gates
        run: scripts/coverage-gate.sh coverage.out

      - name: Save baseline coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: coverage.out
          key: coverage-baseline-${{ github.sha }}

      - name: Restore baseline coverage for diff
        if: github.event_name == 'pull_request'
        id: cov-baseline
        uses: actions/cache/restore@v5
        with:
          path: coverage-baseline.out
          key: coverage-baseline-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            coverage-baseline-

      - name: Coverage diff on PR
        if: github.event_name == 'pull_request'
        run: scripts/cov-diff.sh --github-summary coverage-baseline.out coverage.out

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 30

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install system dependencies
        run: ./scripts/install-ubuntu-deps.sh

      - name: Vet
        run: go vet ./...

      # Guards the CGo-free desktop build. The whole module must keep
      # cross-compiling with no C toolchain on the host; a new cgo import
      # anywhere reds this step. gui/audio's default Linux output is the
      # pure-Go PulseAudio sink; oto (ALSA) is opt-in via -tags otoaudio,
      # so ./... stays cgo-free here.
      - name: CGo-free cross-compile
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "==> $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} \
              go build ./...
          done

      # The opt-in oto/ALSA sink is excluded from every build above, so
      # compile it explicitly or it bit-rots unnoticed.
      - name: Build oto/ALSA audio sink (-tags otoaudio)
        run: go build -tags otoaudio ./gui/audio/...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      # The step above analyses the GOOS=linux build only, so every
      # //go:build windows file (27 of them: gl/, sni/, filedialog/,
      # hicon/) was never linted by CI and had accumulated a baseline
      # nothing would flag. Linting is a type-check, not an execution,
      # so the windows build analyses fine from this runner.
      - name: Lint (GOOS=windows)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.12

      # Same blind spot as windows above, for the browser build: every
      # //go:build js file (the gui/backend/web backend) was unlinted
      # and had accumulated a two-issue baseline. GOARCH must be wasm —
      # js/amd64 is not a valid target pair.
      - name: Lint (GOOS=js)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: js
          GOARCH: wasm
        with:
          version: v2.12

      # The darwin build analyses from this runner with cgo disabled
      # (automatic for cross-compilation), which covers the cgo-free
      # darwin files. The cgo core of the metal backend still needs a
      # macOS runner; tracked separately.
      - name: Lint (GOOS=darwin)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: darwin
        with:
          version: v2.12

      - name: Required-ID check
        run: go run ./tools/requiredid/cmd/requiredid ./...

      # Gates on hand-rolled `:` composition of widget IDs, which is how
      # scoping drifts between a producer and its lookup site. Only mode
      # ids is pass/fail (focus/callbacks are advisory inventories), so
      # unlike `make ergonomics-audit` the step runs ids alone.
      - name: Ergo-audit IDs
        run: go run ./tools/ergonomics-audit/ -mode ids .

  check:
    name: Check (gate)
    needs: [test, vet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph
        with:
          install-linux-deps: 'true'
          add-replace: 'false'

      # tidy-check must run BEFORE the go-glyph replace directive is
      # added, otherwise go mod tidy persists the replace into go.mod
      # and prunes go-glyph from go.sum, triggering a spurious diff.
      - name: Run tidy-check (before replace)
        run: make tidy-check

      - name: Add go-glyph replace
        run: go mod edit -replace=github.com/go-gui-org/go-glyph=./go-glyph

      - name: Run gate checks
        run: make vet deps-doc-check large-files generate-check

      # The export-audit gate needs the sibling consumer repos present to
      # be authoritative (an export used only there would misclassify as
      # internal-only). Shallow-clone them beside the checkout and run the
      # consumer scan; the in-repo run alone cannot fail anything.
      - name: Run export-audit (authoritative)
        run: |
          for repo in go-charts go-edit go-kite go-term go-map; do
            git clone --quiet --depth 1 https://github.com/go-gui-org/$repo.git ../$repo
          done
          go run ./tools/exportaudit/ -mode gate -gui . \
            ../go-charts ../go-edit ../go-kite ../go-term ../go-map

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph
        with:
          install-linux-deps: 'true'

      - name: Build examples
        run: make build-examples

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph

      - name: Build c-archive
        working-directory: examples/ios_demo
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$CC" \
            CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
            CGO_LDFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
            go build -buildmode=c-archive -tags ios -o /dev/null .

      - name: Vet backend
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CGO_ENABLED=1 \
          GOOS=darwin \
          GOARCH=arm64 \
          CC="clang -isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
          go vet -tags ios ./gui/backend/ios/...

      # Full-module lint for the ios build, using the same trick as the
      # vet step above: GOOS=darwin with the -tags ios flag satisfies
      # //go:build ios while the iphoneos sysroot gives the cgo .m files
      # a toolchain, and !ios-tagged darwin files (metal, sysbeep) drop
      # out. The sysbeep test's `&& !ios` tag keeps it from referencing
      # symbols that only the darwin cgo implementation provides.
      - name: Locate iOS SDK
        run: echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Lint (GOOS=ios)
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
          CC: clang
          CGO_CFLAGS: -isysroot ${{ env.IOS_SDK }} -arch arm64 -miphoneos-version-min=15.0
          CGO_LDFLAGS: -isysroot ${{ env.IOS_SDK }} -arch arm64 -miphoneos-version-min=15.0
        with:
          version: v2.12
          args: --build-tags ios ./...

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph

      - name: Build
        run: GOOS=js GOARCH=wasm go build ./...

      - name: Vet
        run: GOOS=js GOARCH=wasm go vet ./...

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test
        run: |
          NODE_JS="$(find "$(go env GOROOT)" -name wasm_exec_node.js -print -quit)"
          printf '#!/bin/bash\nexec node "%s" "$@"\n' "$NODE_JS" > /tmp/go_js_wasm_exec
          chmod +x /tmp/go_js_wasm_exec
          GOOS=js GOARCH=wasm go test -exec=/tmp/go_js_wasm_exec ./gui/...

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # No C toolchain: the Windows build is CGO_ENABLED=0 end to end.
      # msys2 remains only for (a) Mesa's software opengl32.dll, which the
      # GPU-less runner needs at *runtime* for the smoke test, and (b) the
      # bash shell those steps are written in.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          release: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-mesa

      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Test (headless)
        run: CGO_ENABLED=0 go test ./gui/...

      - name: Build showcase
        run: |
          CGO_ENABLED=0 go build \
            -o build/showcase-windows.exe ./examples/showcase/

      - name: Smoke test showcase
        run: |
          # The runner has no GPU: system opengl32.dll is GDI-generic
          # OpenGL 1.1, but the native backend needs 3.3. Drop Mesa's
          # software opengl32.dll (llvmpipe) next to the exe so the
          # app-dir DLL search resolves it first.
          cp /mingw64/bin/opengl32.dll build/
          export GALLIUM_DRIVER=llvmpipe
          echo "Launching showcase (10s timeout to catch DLL load failures)..."
          ./build/showcase-windows.exe &
          PID=$!
          sleep 10
          if ! kill $PID 2>/dev/null; then
            echo "Process exited before timeout — checking exit code..."
            wait $PID
            echo "Showcase exited with code $? (DLL load failures exit non-zero)"
          else
            echo "Showcase started successfully (no DLL failures)"
          fi

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-glyph

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          gomobile init

      - name: Build AAR
        working-directory: examples/android_demo
        run: |
          gomobile bind -target=android/arm64 -androidapi 24 \
            -o /tmp/gogui.aar .

      - name: Vet backend
        run: |
          NDK_CC=$(find $ANDROID_NDK_ROOT -name "aarch64-linux-android*-clang" \
            | grep -v clang++ | sort | tail -1)
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$NDK_CC \
            go vet ./gui/backend/android/...

      # Full-module lint for the android build. Unlike the desktop
      # targets it cannot run cgo-free: purego's android dlfcn uses
      # cgo.Dlopen, and gui/backend/android itself links a C ES3 driver.
      # Lint type-checks the whole module (test files included), not
      # just the backend package the vet step above covers.
      - name: Locate NDK clang
        run: |
          NDK_CC=$(find $ANDROID_NDK_ROOT -name "aarch64-linux-android*-clang" \
            | grep -v clang++ | sort | tail -1)
          echo "NDK_CC=$NDK_CC" >> "$GITHUB_ENV"

      - name: Lint (GOOS=android)
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.NDK_CC }}
        with:
          version: v2.12

  benchmark:
    name: Benchmarks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install system dependencies
        run: ./scripts/install-ubuntu-deps.sh

      - name: Run benchmarks
        run: make bench | tee benchmark-results.txt

      - name: Cache benchmark baseline
        uses: actions/cache/save@v5
        with:
          path: benchmark-results.txt
          key: benchmark-baseline-${{ github.sha }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 90

  benchmark-gate:
    name: Benchmark regression gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install system dependencies
        run: ./scripts/install-ubuntu-deps.sh

      - name: Restore baseline
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: baseline-results.txt
          key: benchmark-baseline-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            benchmark-baseline-

      - name: Run targeted benchmarks
        run: make bench-gate | tee pr-benchmarks.txt

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare benchmarks
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          benchstat -format csv baseline-results.txt pr-benchmarks.txt > benchstat.csv
          echo "## Benchmark comparison" >> $GITHUB_STEP_SUMMARY
          benchstat baseline-results.txt pr-benchmarks.txt >> $GITHUB_STEP_SUMMARY

          # Parse CSV for statistically significant regressions.
          # Columns: name, old, old±, new, new±, delta, p-value, n
          # delta starts with '+' for regressions.
          awk -F',' 'NR>1 {
            gsub(/"/, "", $6);
            if ($6 ~ /^\+/) {
              printf "::warning::%s regressed %s (p=%s)\n", $1, $6, $7
            }
          }' benchstat.csv

      - name: No baseline available
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "::warning::No benchmark baseline cached from main. Skipping comparison."

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install system dependencies
        run: ./scripts/install-ubuntu-deps.sh

      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run security scans
        run: make gosec govulncheck
